autoInstallPeers: true
publicHoistPattern:
  - '*@types*'
  - '*eslint*'
  - '*prettier*'
resolutionMode: time-based
auditSignatures: true
minimumReleaseAge: 3
minimumReleaseAgeExclude:
  - '@cloudingenium/*'
  - '@cloudflare/*'
  - typescript-eslint
  - wrangler
  - workerd
  - brace-expansion
verifyStoreIntegrity: true
allowBuilds:
  esbuild: true
  sharp: true
  '@swc/core': true
  better-sqlite3: true
strictDepBuilds: false
overrides:
  brace-expansion@<=5.0.7: 5.0.8
