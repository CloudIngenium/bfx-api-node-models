name: Publish to GitHub Packages

# This package had no release path at all: 10.0.0 through 10.1.1 were published
# by hand, which is why master reached 10.2.0 while consumers on `^10.1.1` were
# still resolving code from several PRs earlier. Sibling repos (bfx-api-node-rest,
# bitfinex-api-node) publish on a `v*` tag; this mirrors them so the three release
# the same way.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: CloudIngenium/ci-actions/setup-node-pnpm@7d65852f30d2466be07cf8b541c1b41648949f89
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test

      # A tag is a human-typed string; package.json is what actually gets
      # published. Publishing a v10.2.0 tag that carries 10.2.1 in the manifest
      # produces a release nobody can trace back to a ref, so refuse instead.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag v$tag does not match package.json version $manifest"
            exit 1
          fi
          echo "tag v$tag matches package.json"

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: CloudIngenium/ci-actions/setup-node-pnpm@7d65852f30d2466be07cf8b541c1b41648949f89
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run build
      # --no-git-checks: pnpm otherwise refuses to publish from a detached tag
      # checkout. Auth comes from the .npmrc actions/setup-node wrote.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
