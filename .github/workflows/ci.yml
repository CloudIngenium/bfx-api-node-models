name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: CloudIngenium/ci-actions/setup-node-pnpm@8ff1a2a4ec78c914213ccdb5fb6f530d0c9655e0 # v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test

  build-and-test:
    name: build-and-test
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify test matrix succeeded
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "test: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All required checks passed"
