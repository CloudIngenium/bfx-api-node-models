version: 2
registries:
  github-cloudingenium-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_NPM_TOKEN}}
updates:
  - package-ecosystem: "npm"
    registries:
      - github-cloudingenium-npm
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Panama"
    groups:
      all-security:
        applies-to: security-updates
        patterns: ["*"]
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies", "automerge"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Panama"
    groups:
      all-security:
        applies-to: security-updates
        patterns: ["*"]
      all-actions:
        patterns: ["*"]
    labels: ["dependencies", "automerge"]
    commit-message:
      prefix: chore
      include: scope
